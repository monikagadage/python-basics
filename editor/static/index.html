<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Python Basics Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/codemirror@5.65.16/lib/codemirror.css" />
<link rel="stylesheet" href="https://unpkg.com/codemirror@5.65.16/theme/dracula.css" />
<style>
  :root { --bg: #1e1e2e; --panel: #262637; --border: #3a3a52; --text: #e4e4f0; --accent: #7c9cff; --ok: #4ade80; --err: #f87171; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", sans-serif; }
  #layout { display: flex; height: 100vh; }
  #sidebar { width: 220px; background: var(--panel); border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; }
  #sidebar h1 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: #9a9ac0; margin: 0 0 10px; }
  .file-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 2px; word-break: break-word; }
  .file-item:hover { background: #33334a; }
  .file-item.active { background: var(--accent); color: #10101a; font-weight: 600; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
  #toolbar .filename { font-size: 13px; color: #b8b8d8; }
  #toolbar .spacer { flex: 1; }
  button { background: var(--accent); color: #10101a; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  button.secondary { background: #3a3a52; color: var(--text); }
  #status { font-size: 12px; color: #8a8aa8; min-width: 90px; }
  #editor-wrap { flex: 1; min-height: 0; }
  .CodeMirror { height: 100%; font-size: 14px; }
  #console-wrap { height: 34%; border-top: 1px solid var(--border); background: #14141f; display: flex; flex-direction: column; }
  #console-header { padding: 6px 14px; font-size: 12px; color: #8a8aa8; border-bottom: 1px solid var(--border); }
  #console { flex: 1; overflow-y: auto; padding: 10px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; white-space: pre-wrap; }
  .line-pass { color: var(--ok); }
  .line-fail { color: var(--err); }
  .line-err { color: var(--err); }
  .hint { color: #6a6a8a; font-size: 12px; padding: 20px 14px; }
</style>
</head>
<body>
<div id="layout">
  <div id="sidebar">
    <h1>Lessons</h1>
    <div id="file-list"></div>
  </div>
  <div id="main">
    <div id="toolbar">
      <span class="filename" id="current-filename">Select a lesson</span>
      <span id="status"></span>
      <div class="spacer"></div>
      <button class="secondary" id="save-btn">Save</button>
      <button id="run-btn">Run &#9654;  (&#8984;+Enter)</button>
    </div>
    <div id="editor-wrap"><div class="hint">Pick a lesson file on the left to start editing.</div></div>
    <div id="console-wrap">
      <div id="console-header">Output</div>
      <div id="console"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/codemirror@5.65.16/lib/codemirror.js"></script>
<script src="https://unpkg.com/codemirror@5.65.16/mode/python/python.js"></script>
<script>
let cm = null;
let currentFile = null;

async function loadFileList() {
  const res = await fetch("/api/files");
  const files = await res.json();
  const list = document.getElementById("file-list");
  list.innerHTML = "";
  files.forEach((name) => {
    const el = document.createElement("div");
    el.className = "file-item";
    el.textContent = name;
    el.onclick = () => openFile(name);
    list.appendChild(el);
  });
  return files;
}

function setActiveFileItem(name) {
  document.querySelectorAll(".file-item").forEach((el) => {
    el.classList.toggle("active", el.textContent === name);
  });
}

async function openFile(name) {
  const res = await fetch(`/api/files/${encodeURIComponent(name)}`);
  const data = await res.json();
  currentFile = name;
  document.getElementById("current-filename").textContent = name;
  setActiveFileItem(name);
  setStatus("");

  const wrap = document.getElementById("editor-wrap");
  if (!cm) {
    wrap.innerHTML = "";
    const ta = document.createElement("textarea");
    wrap.appendChild(ta);
    cm = CodeMirror.fromTextArea(ta, {
      mode: "python",
      theme: "dracula",
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      extraKeys: {
        "Cmd-Enter": runCurrent,
        "Ctrl-Enter": runCurrent,
        "Cmd-S": (i) => { saveCurrent(); return false; },
        "Ctrl-S": (i) => { saveCurrent(); return false; },
      },
    });
  }
  cm.setValue(data.content);
  cm.focus();
}

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

async function saveCurrent() {
  if (!currentFile || !cm) return;
  setStatus("Saving...");
  await fetch(`/api/files/${encodeURIComponent(currentFile)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: cm.getValue() }),
  });
  setStatus("Saved");
  setTimeout(() => setStatus(""), 1200);
}

function appendConsoleLine(line) {
  const el = document.createElement("div");
  if (line.includes("[PASS]")) el.className = "line-pass";
  else if (line.includes("[FAIL]") || line.includes("Error") || line.includes("Traceback")) el.className = "line-fail";
  el.textContent = line;
  document.getElementById("console").appendChild(el);
}

async function runCurrent() {
  if (!currentFile || !cm) return;
  await saveCurrent();
  const consoleEl = document.getElementById("console");
  consoleEl.innerHTML = "";
  appendConsoleLine(`$ python3 ${currentFile}`);
  setStatus("Running...");
  const res = await fetch(`/api/run/${encodeURIComponent(currentFile)}`, { method: "POST" });
  const data = await res.json();
  data.output.split("\n").forEach((line) => { if (line) appendConsoleLine(line); });
  appendConsoleLine(data.returncode === 0 ? "\n(exit 0)" : `\n(exit ${data.returncode})`);
  setStatus("");
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

document.getElementById("save-btn").onclick = saveCurrent;
document.getElementById("run-btn").onclick = runCurrent;

(async () => {
  const files = await loadFileList();
  if (files.length) openFile(files[0]);
})();
</script>
</body>
</html>
